
user www-data;

events {
}

http {
  sub_filter_types text/html text/css application/javascript;
  log_format custom '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$uri" "$http_x_forwarded_for" "$request_filename"';
  server {
    listen     80;
    server_name  localhost;
    access_log /var/log/nginx/access2.log custom;
    error_log  /var/log/nginx/error2.log  debug;

    location / {
      proxy_pass http://172.18.0.2:8080;
      proxy_connect_timeout 300s;
      proxy_read_timeout 600s;      
    }
    

    location /03789572-f2c0-46ec-8808-8d13d03cb172/ {
        proxy_pass http://172.18.0.5:6901/;          
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;    
        proxy_http_version 1.1;        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control no-cache;        
    }
    
    location /03789572-f2c0-46ec-8808-8d13d03cb172-files/ {
        proxy_pass http://172.18.0.5:8085/;
        sub_filter 'href="/'  'href="/03789572-f2c0-46ec-8808-8d13d03cb172-files/';
        sub_filter 'src="/'  'src="/03789572-f2c0-46ec-8808-8d13d03cb172-files/';
        sub_filter_once off;

        proxy_set_header Host $host;
        client_max_body_size 100M;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; 
    }    


  }
}
