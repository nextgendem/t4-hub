# Documentación Redirección http-https:
# https://doc.traefik.io/traefik/migration/v1-to-v2/#http-to-https-redirection-is-now-configured-on-routers
# código ejemplo:
# https://www.youtube.com/watch?v=naCHq6sMMI8

services:

  app-hub:
    image: app-hub
    container_name: ${APP_HUB_NAME}
    build:
      context: .
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./proxy/nginx.conf:/app/proxy/nginx.conf
      - transformer4-hub-volume:/srv
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

  proxy:
    image: app-hub-nginx
    container_name: ${NGINX_NAME}
    build:
      context: ./proxy
    depends_on:
      - app-hub
    ports:
      - "8001:80"
    expose:
      - "80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf
    command: [ nginx-debug, '-g', 'daemon off;' ]

volumes:
  transformer4-hub-volume:
