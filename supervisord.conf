[supervisord]
nodaemon=true

[program:apphub]
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
# A single worker on purpose. Every worker starts its own sessions_checker, so N workers means N
# cullers racing to rewrite the same nginx.conf and N copies of the startup sweep that deletes
# orphaned session Deployments. It is also what a SQLite DB_CONNECTION_STRING requires.
# --reload is a development flag: it restarts the app on file changes, and a restart wipes sessions.
command=/usr/local/bin/gunicorn --workers 1 --timeout 120 --worker-class uvicorn.workers.UvicornWorker -c /app/apphub/gunicorn_config.py --bind 0.0.0.0:8080 apphub.main:app
directory=/app
user=root
process_name=app-hub
numprocs=1
autostart=true
autorestart=true
redirect_stderr=True
