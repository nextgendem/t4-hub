<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://unpkg.com/twinklecss@1.1.0/twinkle.min.css"/>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
	<header class="p-2 text-bg-dark">
    <div class="container">
      <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
        <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
          <img class="me-3" src="/static/images/LogoNEXTGENDEM_Color_cropped.png" alt="logo_nextgem" width="40">
        </a>
        <span class="me-5 me-lg-auto fs-4 font-weight-bold" style="color:#FFFFFF;font-weight: 500;">NEXTGENDEM</span>
        <div class="text-end">
          <a href="https://demiurge.nextgendem.eu/" class="d-block link-body-emphasis text-decoration-none" data-bs-toggle="dropdown" aria-expanded="true">
            <img src="/static/images/logo_demiurge.png" alt="mdo" width="32" height="32" class="rounded-circle">
          </a>
        </div>
      </div>
    </div>
  </header>
    <div class="flex p-4 m-6 justify-center">
        <h1 class="block text-gray-700 text-m font-bold mb-2">T4-Hub Session</h1>
    </div>
    <div class="flex p-4 m-6 justify-center">
        <form id="loginForm" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4" method="POST" action="/login" style="min-width: 400px;">
		  {% if is_ngd_auth %}
		  <!-- Google OAuth Login Only -->
		  <div class="flex items-center justify-center">
			<button type="button" class="flex items-center justify-center w-full py-2 px-4 border border-gray-300 rounded hover:bg-gray-100" onclick="submitToGoogle()">
			  <img src="https://img.icons8.com/color/48/000000/google-logo.png" height="24" alt="Google Logo" width="24" class="mr-2">
			  <span>Continue with Google</span>
			</button>
		  </div>
		  {% else %}
		  <!-- Username/Password Login -->
		  <div class="mb-4">
			<label class="block text-gray-700 text-sm font-bold mb-2" for="username">
			  Username
			</label>
			<input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="username" name="username" type="text" placeholder="Enter username">
		  </div>
		  <div class="mb-6">
			<label class="block text-gray-700 text-sm font-bold mb-2" for="password">
			  Password
			</label>
			<input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" id="password" name="password" type="password" placeholder="Enter password">
		  </div>
		  <div class="mb-4">
			<button type="submit" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" onclick="submitToLogin()">
			  Login
			</button>
		  </div>

		  <!-- Divider -->
		  <div class="flex items-center my-4">
			<hr class="flex-grow border-gray-300">
			<span class="px-3 text-gray-500 text-sm">or</span>
			<hr class="flex-grow border-gray-300">
		  </div>

		  <!-- Google OAuth Login -->
		  <div class="flex items-center justify-center">
			<button type="button" class="flex items-center justify-center w-full py-2 px-4 border border-gray-300 rounded hover:bg-gray-100" onclick="submitToGoogle()">
			  <img src="https://img.icons8.com/color/48/000000/google-logo.png" height="24" alt="Google Logo" width="24" class="mr-2">
			  <span>Continue with Google</span>
			</button>
		  </div>
		  {% endif %}
		</form>
	</div>
	<script>
	  function submitToLogin() {
		const form = document.getElementById('loginForm');
		form.action = '/login'; // Cambia la acción al endpoint de login normal
		form.submit();
	  }

	  function submitToGoogle() {
		const form = document.getElementById('loginForm');
		form.action = '/login/google'; // Cambia la acción al endpoint de Google OAuth
		form.submit();
	  }
	</script>
      
</body>
</html>
