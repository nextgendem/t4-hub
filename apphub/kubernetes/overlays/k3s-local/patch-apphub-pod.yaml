apiVersion: v1
kind: Pod
metadata:
  name: proxy-app-hub
spec:
  volumes:
    - $patch: replace
    - name: nginx-conf
      emptyDir: {}
    - name: srv
      hostPath:
        path: /tmp/t4hub-storage/srv
        type: DirectoryOrCreate
    - name: source-code
      hostPath:
        path: /home/rnebot/GoogleDrive/AA_ENCARGO_JB/t4-hub
        type: Directory
  containers:
    - name: app-hub
      imagePullPolicy: Never   # Use locally loaded k3s image
      env:
      - name: ENV_FILE
        value: "/app/app_hub_local.env"
      - name: POD_NAME
        value: "proxy-app-hub"
      volumeMounts:
        - mountPath: /app/proxy
          name: nginx-conf
        - mountPath: /srv
          name: srv
        # Live source code mounts for debugging
        - mountPath: /app/apphub
          name: source-code
          subPath: apphub
        - mountPath: /app/app_hub_local.env
          name: source-code
          subPath: app_hub_local.env
        - mountPath: /app/app-deployment-template2.yaml
          name: source-code
          subPath: app-deployment-template2.yaml
