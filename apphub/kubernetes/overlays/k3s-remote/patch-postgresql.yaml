apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
spec:
  template:
    spec:
      containers:
      - name: postgresql
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
      volumes:
      - $patch: replace
      - name: postgres-data
        hostPath:
          path: /var/lib/t4hub-storage/postgres-data
          type: DirectoryOrCreate
