apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-app-hub
  labels:
    app: app-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-hub
  template:
    metadata:
      labels:
        app: app-hub
        app-user: t4hub-container
    spec:
      serviceAccountName: internal-kubectl
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: srv
          emptyDir: {}   # Overlays replace with hostPath or PVC
      initContainers:
        - name: init-nginx-conf
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /etc/nginx/conf.d
              echo 'events { } http { }' > /etc/nginx/nginx.conf
              cp /etc/nginx/nginx.conf /etc/nginx/conf.d/default.conf
          volumeMounts:
          - name: nginx-conf
            mountPath: /etc/nginx
      containers:
        - name: app-hub
          image: app-hub:latest
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8080
            name: http
          env:
          - name: ENV_FILE
            value: "/app/app_hub_local.env"
          volumeMounts:
            - mountPath: /app/proxy
              name: nginx-conf
            - mountPath: /srv
              name: srv
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
        - name: nginx-container
          image: nginx:latest
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 80
            name: http-proxy
          volumeMounts:
            - mountPath: /etc/nginx
              name: nginx-conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: apphub-svc
spec:
  type: ClusterIP   # Overlays change this (NodePort, LoadBalancer, etc.)
  selector:
    app: app-hub
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
