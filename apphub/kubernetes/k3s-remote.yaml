# T4-Hub Kubernetes Manifest for K3s Remote Deployment
#
# This manifest deploys t4-hub to a remote k3s cluster with production-like settings.
#
# Differences from k3s-local:
# - Uses t4hub namespace for isolation
# - Persistent storage at /var/lib/t4hub-storage (survives reboots)
# - LoadBalancer or Ingress for external access (configure as needed)
# - Resource limits suitable for production
#
# Prerequisites:
# 1. k3s cluster with kubectl configured
# 2. Images available (build and import or use container registry)
# 3. Storage directory created on all nodes: /var/lib/t4hub-storage/config-apphub
#
# Deploy with:
#   kubectl create namespace t4hub
#   kubectl apply -f apphub/kubernetes/k3s-remote.yaml

---
# Namespace for t4hub
apiVersion: v1
kind: Namespace
metadata:
  name: t4hub

---
# ServiceAccount for app-hub to execute kubectl commands
apiVersion: v1
kind: ServiceAccount
metadata:
  name: internal-kubectl
  namespace: t4hub

---
# Role allowing app-hub to manage pods and deployments
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: modify-pods
  namespace: t4hub
rules:
  - apiGroups: ["", "metrics.k8s.io"]
    resources:
      - pods
      - pods/exec
    verbs:
      - get
      - create
      - list
      - delete
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments/scale
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# RoleBinding to grant permissions to ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: modify-pods-to-sa
  namespace: t4hub
subjects:
  - kind: ServiceAccount
    name: internal-kubectl
    namespace: t4hub
roleRef:
  kind: Role
  name: modify-pods
  apiGroup: rbac.authorization.k8s.io

---
# PostgreSQL Deployment for session database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: t4hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_DB
          value: "sessions_db"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
      volumes:
      - name: postgres-data
        hostPath:
          path: /var/lib/t4hub-storage/postgres-data
          type: DirectoryOrCreate

---
# PostgreSQL Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: t4hub
spec:
  selector:
    app: postgresql
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP

---
# Main Hub Pod with app-hub and nginx containers
apiVersion: v1
kind: Pod
metadata:
  name: proxy-app-hub
  namespace: t4hub
  labels:
    app: app-hub
    # Label used by get_container_ip in helpers.py
    app-user: t4hub-container
spec:
  serviceAccountName: internal-kubectl
  restartPolicy: OnFailure
  volumes:
    # Shared volume for nginx.conf between app-hub and nginx containers
    - name: nginx-conf
      emptyDir: {}
    # Shared config directory for app containers
    - name: config
      hostPath:
        path: /var/lib/t4hub-storage/config-apphub
        type: DirectoryOrCreate
    # SQLite database volume (if using sqlite instead of postgresql)
    - name: srv
      hostPath:
        path: /var/lib/t4hub-storage/srv
        type: DirectoryOrCreate

  initContainers:
    # Initialize empty nginx.conf file
    - name: init-nginx-conf
      image: busybox:latest
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          mkdir -p /etc/nginx/conf.d
          echo 'events { } http { }' > /etc/nginx/nginx.conf
          cp /etc/nginx/nginx.conf /etc/nginx/conf.d/default.conf
      volumeMounts:
      - name: nginx-conf
        mountPath: /etc/nginx

  containers:
    # App-hub container (FastAPI backend)
    - name: app-hub
      image: app-hub:latest
      imagePullPolicy: IfNotPresent
      ports:
      - containerPort: 8080
        name: http
      env:
      - name: ENV_FILE
        value: "/app/app_hub_k3s_remote.env"
      - name: K8S_NAMESPACE
        value: "t4hub"
      - name: STORAGE_BASE_PATH
        value: "/var/lib/t4hub-storage"
      volumeMounts:
        - mountPath: /app/proxy
          name: nginx-conf
        - mountPath: /srv
          name: srv
      resources:
        requests:
          memory: "512Mi"
          cpu: "1000m"
        limits:
          memory: "2Gi"
          cpu: "4000m"

    # Nginx container (reverse proxy)
    - name: nginx-container
      image: nginx:latest
      imagePullPolicy: IfNotPresent
      ports:
      - containerPort: 80
        name: http
      volumeMounts:
        - mountPath: /etc/nginx
          name: nginx-conf
      resources:
        requests:
          memory: "128Mi"
          cpu: "200m"
        limits:
          memory: "256Mi"
          cpu: "500m"

---
# Service exposing the hub (change type as needed)
apiVersion: v1
kind: Service
metadata:
  name: apphub-svc
  namespace: t4hub
spec:
  type: LoadBalancer  # Or ClusterIP if using Ingress
  selector:
    app: app-hub
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
