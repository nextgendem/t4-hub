# T4-Hub Kubernetes Manifest for K3s Local Deployment
#
# This manifest deploys t4-hub to a local k3s cluster for testing.
#
# Prerequisites:
# 1. k3s installed and running
# 2. Images loaded into k3s:
#    - app-hub:latest
#    - transformer4:latest
# 3. Storage directory created: /tmp/t4hub-storage/config-apphub
#
# Deploy with:
#   kubectl config use-context k3s
#   kubectl apply -f apphub/kubernetes/k3s-local.yaml
#
# Access:
#   http://localhost:30080 (NodePort)
#   OR kubectl port-forward pod/proxy-app-hub 8001:80

---
# ServiceAccount for app-hub to execute kubectl commands
apiVersion: v1
kind: ServiceAccount
metadata:
  name: internal-kubectl
  namespace: default

---
# Role allowing app-hub to manage pods and deployments
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: modify-pods
  namespace: default
rules:
  - apiGroups: ["", "metrics.k8s.io"]
    resources:
      - pods
      - pods/exec
    verbs:
      - get
      - create
      - list
      - delete
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments/scale
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# RoleBinding to grant permissions to ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: modify-pods-to-sa
  namespace: default
subjects:
  - kind: ServiceAccount
    name: internal-kubectl
    namespace: default
roleRef:
  kind: Role
  name: modify-pods
  apiGroup: rbac.authorization.k8s.io

---
# PostgreSQL Deployment for session database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_DB
          value: "sessions_db"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        hostPath:
          path: /tmp/t4hub-storage/postgres-data
          type: DirectoryOrCreate

---
# PostgreSQL Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: default
spec:
  selector:
    app: postgresql
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP

---
# Main Hub Pod with app-hub and nginx containers
apiVersion: v1
kind: Pod
metadata:
  name: proxy-app-hub
  namespace: default
  labels:
    app: app-hub
    # Label for same-pod networking - matches APP_HUB_NAME in app_hub_local.env
    app-user: localhost
spec:
  serviceAccountName: internal-kubectl
  restartPolicy: OnFailure
  volumes:
    # Shared volume for nginx.conf between app-hub and nginx containers
    - name: nginx-conf
      emptyDir: {}
    # Shared config directory for app containers
    - name: config
      hostPath:
        path: /tmp/t4hub-storage/config-apphub
        type: DirectoryOrCreate
    # SQLite database volume (if using sqlite instead of postgresql)
    - name: srv
      hostPath:
        path: /tmp/t4hub-storage/srv
        type: DirectoryOrCreate
    # Source code directory for live debugging (k3s local only)
    - name: source-code
      hostPath:
        path: /home/rnebot/GoogleDrive/AA_ENCARGO_JB/t4-hub
        type: Directory

  initContainers:
    # Initialize empty nginx.conf file
    - name: init-nginx-conf
      image: busybox:latest
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          mkdir -p /etc/nginx/conf.d
          echo 'events { } http { }' > /etc/nginx/nginx.conf
          cp /etc/nginx/nginx.conf /etc/nginx/conf.d/default.conf
      volumeMounts:
      - name: nginx-conf
        mountPath: /etc/nginx

  containers:
    # App-hub container (FastAPI backend)
    - name: app-hub
      image: app-hub:latest
      imagePullPolicy: Never  # Use local image loaded into k3s
      ports:
      - containerPort: 8080
        name: http
      env:
      - name: ENV_FILE
        value: "/app/app_hub_local.env"
      - name: POD_NAME
        value: "proxy-app-hub"
      volumeMounts:
        - mountPath: /app/proxy
          name: nginx-conf
        - mountPath: /srv
          name: srv
        # Live source code mounts for debugging
        - mountPath: /app/apphub
          name: source-code
          subPath: apphub
        - mountPath: /app/app_hub_local.env
          name: source-code
          subPath: app_hub_local.env
        - mountPath: /app/app-deployment-template2.yaml
          name: source-code
          subPath: app-deployment-template2.yaml
      resources:
        requests:
          memory: "256Mi"
          cpu: "500m"
        limits:
          memory: "1Gi"
          cpu: "2000m"

    # Nginx container (reverse proxy)
    - name: nginx-container
      image: nginx:latest
      imagePullPolicy: IfNotPresent
      ports:
      - containerPort: 80
        name: http-proxy
      volumeMounts:
        - mountPath: /etc/nginx
          name: nginx-conf
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "500m"

---
# Service exposing the hub via NodePort
apiVersion: v1
kind: Service
metadata:
  name: apphub-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: app-hub
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080  # Access via http://localhost:30080
